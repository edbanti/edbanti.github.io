<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../style.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(120% 100% at 15% 0%, #123430 0%, #0C2422 100%);
    color: #EFEBE1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 88px;
    font-family: "Newsreader", Georgia, serif;
  }
  h1 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 168px;
    line-height: 0.85;
    letter-spacing: -0.045em;
    text-transform: uppercase;
  }
  h1 span { display: block; }
  .rule { height: 3px; width: 560px; background: #E9A227; margin: 40px 0 32px; }
  p { font-size: 30px; color: #EFEBE1; max-width: 700px; line-height: 1.45; }
  .url {
    position: absolute;
    bottom: 56px;
    right: 88px;
    font-family: "JetBrains Mono", monospace;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #A9B5AE;
  }
</style>
</head>
<body>
  <h1><span>Ed</span><span>Banti</span></h1>
  <div class="rule"></div>
  <p>Doxie and girl dad. Tech enthusiast and introvert.</p>
  <div class="url">edbanti.com</div>
</body>
</html>
